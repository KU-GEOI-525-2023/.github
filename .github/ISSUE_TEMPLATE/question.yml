name: Question or Help
description: Ask a question about the course, assignments, or technical issues
title: "[QUESTION]: "
labels: ["question", "help-wanted"]
body:
  - type: markdown
    attributes:
      value: |
        ## Question or Help Request
        
        Ask questions about course content, assignments, or technical issues.
        
  - type: dropdown
    id: question-category
    attributes:
      label: Question Category
      description: Select the category that best fits your question
      options:
        - Course Content
        - Assignment/Project
        - Technical Issue
        - Data Processing
        - Model Training
        - Deep Learning Concepts
        - Remote Sensing Concepts
        - Other
    validations:
      required: true
      
  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
      placeholder: "Ask your question here..."
    validations:
      required: true
      
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide context or background information
      placeholder: "What have you tried? What are you working on?"
    validations:
      required: false
      
  - type: textarea
    id: code-snippet
    attributes:
      label: Relevant Code
      description: If applicable, include relevant code snippets
      placeholder: "Paste code here..."
      render: python
    validations:
      required: false
      
  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to relevant documentation, papers, or resources you've consulted
      placeholder: "Include any references..."
    validations:
      required: false
